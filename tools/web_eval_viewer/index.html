<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spaCy NER Evaluation Results Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-icon-wrapper">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="brand-titles">
          <h1>
            spaCy NER Evaluation Scanner
            <span class="badge-version">v2.1 Suite</span>
          </h1>
          <p class="brand-subtitle">
            Human-readable inspection tool for held-out validation, out-of-domain benchmarks, and dictionary overrides
          </p>
        </div>
      </div>

      <div class="header-actions">
        <div id="quick-stats-container" style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
          <!-- Populated dynamically -->
        </div>
        <button class="icon-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <!-- Primary Navigation: File Types Tabs -->
    <nav class="primary-tabs-nav" id="primary-tabs-nav">
      <!-- Populated dynamically -->
    </nav>

    <!-- Sub-Navigation: Models, Scopes, Filters -->
    <div class="subnav-container" id="subnav-wrapper">
      <!-- Populated dynamically -->
    </div>

    <!-- Main Content Container -->
    <main id="main-view-container">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h3>Loading evaluation datasets...</h3>
      </div>
    </main>
  </div>

  <!-- Global Tooltip Popover -->
  <div id="global-tooltip" class="tooltip-popover" style="display:none;"></div>

  <!-- Global Toast Notification -->
  <div id="global-toast" class="toast-notice"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
